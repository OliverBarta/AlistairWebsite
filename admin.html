<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Listing</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div id="loginSection">
        <h2>Log in</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="loginBtn">Log in</button>
        <p id="loginError" style="color:red;"></p>
    </div>

    <div id="adminSection" style="display:none;">
        <h2>Add New Listing</h2>
        <button id="logoutBtn">Log out</button>

        <form id="addListingForm">
            <input type="text" id="name" placeholder="Name" required>
            <input type="text" id="brand" placeholder="Brand" required>
            <input type="number" id="price" placeholder="Price" required>
            <input type="number" id="stock" placeholder="Stock" value="1" required>
            <textarea id="images" placeholder="Image URLs, paste url then hit enter and paste next url" rows="5" required></textarea>
            <button type="submit">Add Listing</button>
        </form>
        <p id="formMessage"></p>


        <div id="manageListings">
            <h2>Manage Listings</h2>
            <div id="listingsList"></div>
        </div>
        
        <!-- Edit modal, hidden by default -->
        <div id="editModal" style="display:none;">
            <h2>Edit Listing</h2>
            <input type="hidden" id="editId">
            <input type="text" id="editName" placeholder="Name" required>
            <input type="text" id="editBrand" placeholder="Brand" required>
            <input type="number" id="editPrice" placeholder="Price" required>
            <input type="number" id="editStock" placeholder="Stock" required>
            <textarea id="editImages" placeholder="Image URLs, paste url then hit enter and paste next url" rows="5" required></textarea>
            <button id="saveEditBtn">Save changes</button>
            <button id="cancelEditBtn">Cancel</button>
            <p id="editMessage"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
